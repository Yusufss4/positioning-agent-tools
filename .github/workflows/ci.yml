name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      IPE_ROOT: ${{ github.workspace }}/indoor-positioning-engine
    steps:
      - uses: actions/checkout@v4
        with:
          path: positioning-agent-tools
      - uses: actions/checkout@v4
        with:
          repository: Yusufss4/indoor-positioning-engine
          path: indoor-positioning-engine
      - name: Build engine tools
        run: |
          cmake -S "$IPE_ROOT" -B "$IPE_ROOT/build" -DCMAKE_BUILD_TYPE=Release -DIPE_BUILD_TESTS=OFF
          cmake --build "$IPE_ROOT/build" -j
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: positioning-agent-tools
        run: python -m pip install -e '.[dev]'
      - name: Test
        working-directory: positioning-agent-tools
        run: python -m pytest -q
